{{define "title"}}Login | logline{{end}}

{{define "nav"}}{{end}}

{{define "content"}}
<div class="flex min-h-[80vh] items-center justify-center">
    <div class="w-full max-w-sm">
        <h1 class="mb-6 text-center font-mono text-2xl font-bold tracking-tight">logline</h1>

        {{if .Error}}
        <div class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
            {{.Error}}
        </div>
        {{end}}

        <form method="POST" action="/dashboard/login" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" required
                    class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required
                    class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>
            <button type="submit"
                class="w-full rounded-md bg-gray-900 px-4 py-2 text-sm font-medium text-white hover:bg-gray-800">
                Log in
            </button>
        </form>
    </div>
</div>
{{end}}
